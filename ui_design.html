<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICKLE - UI Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .plugin-container {
            width: 400px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .plugin-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(144, 238, 144, 0.1) 0%, rgba(34, 139, 34, 0.1) 100%);
            border-radius: 24px;
            z-index: -1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .knobs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .knob {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .knob:hover {
            transform: scale(1.05);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .knob-indicator {
            position: absolute;
            width: 4px;
            height: 25px;
            background: linear-gradient(to bottom, #90ee90, #228b22);
            border-radius: 2px;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(144, 238, 144, 0.8);
        }

        .knob-label {
            margin-top: 10px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .knob-value {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        .main-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        .main-knob {
            width: 90px;
            height: 90px;
            background: rgba(144, 238, 144, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            border: 3px solid rgba(144, 238, 144, 0.5);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 6px 25px rgba(144, 238, 144, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .main-knob:hover {
            transform: scale(1.08);
            box-shadow: 
                0 8px 30px rgba(144, 238, 144, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.4);
        }

        .main-knob .knob-indicator {
            width: 6px;
            height: 35px;
            background: linear-gradient(to bottom, #90ee90, #006400);
            top: 10px;
            box-shadow: 0 0 15px rgba(144, 238, 144, 1);
        }

        .sub-knob {
            width: 50px;
            height: 50px;
            margin-top: 10px;
        }

        .sub-knob .knob-indicator {
            width: 3px;
            height: 18px;
            top: 6px;
        }

        .pickle-emoji {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            opacity: 0.8;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .bottom-section {
            margin-top: 20px;
            text-align: center;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .preset-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: rgba(144, 238, 144, 0.2);
            border-color: rgba(144, 238, 144, 0.4);
            transform: translateY(-1px);
        }

        .highlight {
            background: rgba(144, 238, 144, 0.15) !important;
            border-color: rgba(144, 238, 144, 0.4) !important;
        }
    </style>
</head>
<body>
    <div class="plugin-container">
        <div class="pickle-emoji">🥒</div>
        
        <div class="header">
            <div class="title">PICKLE</div>
            <div class="subtitle">Audio Processor</div>
        </div>

        <div class="knobs-grid">
            <div class="knob-container">
                <div class="knob">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(45deg);"></div>
                </div>
                <div class="knob-label">BRINE</div>
                <div class="knob-value">50%</div>
            </div>

            <div class="knob-container">
                <div class="knob">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(-30deg);"></div>
                </div>
                <div class="knob-label">SPICE</div>
                <div class="knob-value">25%</div>
            </div>

            <div class="knob-container">
                <div class="knob">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(90deg);"></div>
                </div>
                <div class="knob-label">FERMENT</div>
                <div class="knob-value">75%</div>
            </div>

            <div class="knob-container">
                <div class="knob">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(0deg);"></div>
                </div>
                <div class="knob-label">JUICE</div>
                <div class="knob-value">100%</div>
            </div>

            <div class="knob-container">
                <div class="knob">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(60deg);"></div>
                </div>
                <div class="knob-label">CRUNCH</div>
                <div class="knob-value">30%</div>
            </div>

            <div class="knob-container">
                <div class="knob sub-knob">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(15deg);"></div>
                </div>
                <div class="knob-label">BITCRUSH</div>
                <div class="knob-value">10%</div>
            </div>
        </div>

        <div class="main-controls">
            <div class="knob-container">
                <div class="main-knob highlight">
                    <div class="knob-indicator" style="transform: translateX(-50%) rotate(120deg);"></div>
                </div>
                <div class="knob-label" style="font-size: 14px; font-weight: 600;">PROCESSOR</div>
                <div class="knob-value">80%</div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="preset-buttons">
                <button class="preset-btn">SUBTLE</button>
                <button class="preset-btn">BALANCED</button>
                <button class="preset-btn">AGGRESSIVE</button>
                <button class="preset-btn">EXTREME</button>
            </div>
        </div>
    </div>
</body>
</html>
