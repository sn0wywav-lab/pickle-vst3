[package]
name = "pickle-voice"
description = "Filterless voice + camera video engine for the Pickle client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["video", "camera"]
# H.264 encode/decode (OpenH264 is compiled from source, no system deps).
video = ["dep:openh264"]
# Webcam capture (V4L2 / Media Foundation / AVFoundation).
camera = ["video", "dep:nokhwa"]

[dependencies]
pickle-discord.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
rand.workspace = true
uuid.workspace = true

cpal = "0.18"
audiopus_sys = "0.2.2"
rtrb = "0.4"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
davey = "0.2"
socket2 = "0.6"

openh264 = { version = "0.9", optional = true }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native", "decoding"] }
