[workspace]
resolver = "2"
members = [
    "crates/pickle-discord",
    "crates/pickle-voice",
    "crates/pickle-themes",
    "crates/pickle-plugins",
    "crates/pickle-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/sn0wywav-lab/pickle-vst3"

[workspace.dependencies]
pickle-discord = { path = "crates/pickle-discord" }
pickle-voice = { path = "crates/pickle-voice", default-features = false }
pickle-themes = { path = "crates/pickle-themes" }
pickle-plugins = { path = "crates/pickle-plugins" }

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false

# Keep the hot DSP / codec / JS code fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
